    <g>
      <rect x="154" y="268" width="118" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="213" y="290">describe</text>
    </g>
    <g>
      <rect x="286" y="268" width="72" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="322" y="290">ocr</text>
    </g>
    <g>
      <rect x="372" y="268" width="116" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="430" y="290">ui-review</text>
    </g>
    <g>
      <rect x="502" y="268" width="124" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="564" y="290">chart-data</text>
    </g>
    <g>
      <rect x="640" y="268" width="142" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="711" y="290">object-detect</text>
    </g>
    <g>
      <rect x="796" y="268" width="104" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="848" y="290">compare</text>
    </g>
    <g>
      <rect x="914" y="268" width="110" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="969" y="290">code-gen</text>
    </g>
    <g>
      <rect x="1038" y="268" width="84" height="34" rx="17" fill="#4d6bfe" fill-opacity="0.08" stroke="#4d6bfe" stroke-opacity="0.35"/>
      <text x="1080" y="290">debug</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="640" y="346" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8aa0c4"><tspan fill="#059669" font-weight="700">FREE vision source built-in</tspan><tspan>&#160;&#160;·&#160;&#160;Any OpenAI / Anthropic-compatible endpoint&#160;&#160;·&#160;&#160;local path&#160;&#160;·&#160;&#160;URL&#160;&#160;·&#160;&#160;privacy-first</tspan></text>
</svg>
