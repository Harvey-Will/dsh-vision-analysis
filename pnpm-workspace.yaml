packages:
  - .
# DSH ships rapid prereleases (rc/alpha within the same 0.1.x line); pnpm's
# default release-age cutoff rejects same-day publishes and silently downgrades
# the resolution to stale versions. The committed lockfile pins exact versions,
# so the supply-chain window protection is not needed here.
minimumReleaseAge: 0
# Upstream publishing bug: some DSH packages convert their `workspace:^`
# dependency into a FINAL-only npm range that cannot match published prereleases.
# Pinning the same rc line is semantically exact and unblocks installation.
overrides:
  "@deepseek-ai/dsh-session-projection": "0.2.1-rc.1"
  "@deepseek-ai/dsh-session-projection-cache": "0.2.1-rc.1"
  "@deepseek-ai/dsh-storage-domain": "0.2.1-rc.1"
  "@deepseek-ai/dsh-storage": "0.2.1-rc.1"
  # Deduplicate dsh-llm: the stale @deepseek-ai/dsh-host-apiproxy dev dependency
  # pulls an old dsh-llm whose branded types conflict with the current instance.
  "@deepseek-ai/dsh-llm": "0.2.1-rc.1"
  # dsh-invariants was removed from the 0.2.1 line (alpha.1 breaking change),
  # but the stale host-apiproxy transitive tree still peer-requires it through a
  # final-only range (the workspace:^ conversion bug). Pin the last published.
  "@deepseek-ai/dsh-invariants": "0.2.0-rc.2"

